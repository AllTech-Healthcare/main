name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: test_secret_key_for_ci
      ENCRYPTION_KEY: M5aAp8BxIIXcUflGe3IEnUKN-ti6u6FrwQ1_mnRbwCU=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Lint
        run: |
          cd backend && flake8 .
      - name: Test
        run: pytest backend/tests

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t backend ./backend
      - name: Build frontend image
        run: docker build -t frontend ./frontend
      - name: Build ml-services image
        run: docker build -t ml-services ./ml-services
      - name: Test ML services
        run: docker run --rm ml-services
